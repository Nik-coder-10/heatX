# =============================================================================
# Compression Configuration
# =============================================================================

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    text/x-component
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/manifest+json
    application/vnd.api+json
    application/geo+json
    image/svg+xml
    image/x-icon
    image/vnd.microsoft.icon
    font/ttf
    font/otf
    font/woff
    font/woff2;

# Brotli (if module is available)
# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;
