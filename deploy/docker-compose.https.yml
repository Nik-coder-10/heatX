# =============================================================================
# Urban Heat Mitigation Platform - HTTPS Overlay (Certbot)
# Usage: docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.https.yml up -d
# First run: sudo ./deploy/scripts/init-letsencrypt.sh
# =============================================================================

services:
  # ===================== CERTBOT =====================
  certbot:
    image: certbot/certbot:v2.9.0
    container_name: urbanheat-certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ===================== NGINX (HTTPS Override) =====================
  nginx:
    volumes:
      - ./deploy/nginx/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  certbot_data:
    driver: local
  certbot_www:
    driver: local
