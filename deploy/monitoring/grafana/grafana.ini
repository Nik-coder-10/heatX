# =============================================================================
# Urban Heat Mitigation Platform - Grafana Configuration
# =============================================================================

[server]
protocol = http
http_port = 3000
domain = localhost
root_url = /grafana/
serve_from_sub_path = true
enable_gzip = true

[security]
admin_user = ${GF_SECURITY_ADMIN_USER:-admin}
admin_password = ${GF_SECURITY_ADMIN_PASSWORD:-admin}
secret_key = ${GF_SECURITY_SECRET_KEY:-change-me-in-production}
disable_gravatar = true

[database]
type = sqlite3
path = grafana.db

[session]
provider = memory

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[auth]
disable_login_form = false
oauth_auto_login = false

[analytics]
check_for_updates = false
reporting_enabled = false

[grafana_com]
url = https://grafana.com

[log]
mode = console
level = info

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins

[alerting]
enabled = true
execute_alerts = true

[unified_alerting]
enabled = true

[metrics]
enabled = true
interval_seconds = 10

[snapshots]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/system-monitoring.json
