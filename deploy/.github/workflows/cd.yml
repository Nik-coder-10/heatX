# =============================================================================
# Urban Heat Mitigation Platform - CD Pipeline
# Deploys to production on push to main with version tags
# =============================================================================

name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1

jobs:
  # ===== Version =====
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(git rev-parse --short HEAD)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  # ===== Build & Push Images =====
  build:
    name: Build & Push
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,prefix={{date 'YYYYMMDD'}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ===== Deploy =====
  deploy:
    name: Deploy
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd /opt/urbanheat

            # Pull latest images
            docker compose -f deploy/docker-compose.prod.yml pull

            # Deploy with new images
            ./deploy/scripts/deploy.sh prod --pull --monitoring

            # Clean up old images
            docker image prune -f

            # Verify deployment
            ./deploy/scripts/health-check.sh --json
          EOF

      - name: Post-deploy health check
        run: |
          sleep 10
          curl -sf https://${{ secrets.DOMAIN }}/api/v1/health || \
          curl -sf http://${{ secrets.DEPLOY_HOST }}/api/v1/health || \
          echo "Health check pending..."

  # ===== Release =====
  release:
    name: Release
    needs: [version, build, deploy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes
        id: notes
        run: |
          echo "### Docker Images" >> release-notes.md
          echo "" >> release-notes.md
          echo "- \`ghcr.io/${{ github.repository }}-backend:${{ needs.version.outputs.version }}\`" >> release-notes.md
          echo "- \`ghcr.io/${{ github.repository }}-frontend:${{ needs.version.outputs.version }}\`" >> release-notes.md
          echo "- \`ghcr.io/${{ github.repository }}-worker:${{ needs.version.outputs.version }}\`" >> release-notes.md
          echo "" >> release-notes.md
          cat RELEASE_NOTES.md >> release-notes.md 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
