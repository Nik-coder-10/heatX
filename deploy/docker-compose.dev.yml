# =============================================================================
# Urban Heat Mitigation Platform - Development Docker Compose
# Single command: docker compose -f deploy/docker-compose.dev.yml up -d
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &db-healthcheck
  test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  # ===================== DATABASE =====================
  postgres:
    image: postgis/postgis:15-3.3
    container_name: urbanheat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-urbanheat}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck: *db-healthcheck
    logging: *default-logging
    restart: unless-stopped

  # ===================== REDIS =====================
  redis:
    image: redis:7-alpine
    container_name: urbanheat-redis
    command: [
      "redis-server",
      "--save", "60", "1",
      "--loglevel", "notice",
      "--maxmemory", "256mb",
      "--maxmemory-policy", "allkeys-lru",
    ]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # ===================== MINIO (Object Storage) =====================
  minio:
    image: minio/minio:latest
    container_name: urbanheat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  # ===================== BACKEND =====================
  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend/Dockerfile.dev
    container_name: urbanheat-backend
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-urbanheat}
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-urbanheat-data}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
      FRONTEND_HOST: http://localhost:5173
      API_V1_STR: /api/v1
      ENVIRONMENT: development
    volumes:
      - ../backend:/app
      - ../backend/alembic.ini:/app/alembic.ini
      - ../backend/alembic:/app/alembic
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # ===================== CELERY WORKER =====================
  worker:
    build:
      context: ..
      dockerfile: deploy/docker/worker/Dockerfile
    container_name: urbanheat-worker
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-urbanheat}
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-urbanheat-data}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: development
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # ===================== FRONTEND =====================
  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend/Dockerfile.dev
    container_name: urbanheat-frontend
    environment:
      VITE_BACKEND_URL: http://localhost:8000
      NODE_ENV: development
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    logging: *default-logging
    restart: unless-stopped

  # ===================== NGINX REVERSE PROXY =====================
  nginx:
    image: nginx:1.25-alpine
    container_name: urbanheat-nginx
    volumes:
      - ../deploy/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    logging: *default-logging
    restart: unless-stopped

  # ===================== FLOWER (Celery Monitor) =====================
  flower:
    image: mher/flower:2.0
    container_name: urbanheat-flower
    command: ["celery", "flower", "--broker=redis://redis:6379/0", "--port=5555"]
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker
    logging: *default-logging
    restart: unless-stopped

  # ===================== PGADMIN (Database Admin) =====================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: urbanheat-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@urbanheat.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  default:
    name: urbanheat-network
    driver: bridge
