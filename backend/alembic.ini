[alembic]
# path to migration scripts
script_location = app/alembic

# template used to generate migration files
# template_args =

# temp directory

# The set of generators implemented by the script
# directory, in order of decreasing priority.  The first
# implemented here that returns non-None will be used;
# if none of the generators return Non-None, the revision
# ID will be a combination of timestamp + counter.
# If this is left as blank, a tuple ("%(rev_id)s", "_")
# is used as the default.
# version_path_separator = os.path.sep
# The character used for revision levels in directory
# names, e.g.  "2016_04_27_1234_abcdef" would have three
# levels: 2016, 04, 27, 1234, abcdef
# version_path_separator =

# The version table name to be used in the database.
# This defaults to 'alembic_version'.
# If using in a production database with schemas,
# it may be desireable to specify the schema here
# as well, to ensure the version table is created
# in the desired schema.
# version_table = alembic_version
# version_table_schema =

# The output encoding used when revision files
# are written from script.py.mako
outfile_encoding = utf-8

# The timezone to use when rendering the date
# and time in the migration file prologue.
# If not specified, the current timezone of the
# machine running the migration will be used.
# timezone =

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
revision_environment = false

# Set to 'true' to allow duplicate revision numbers
allow_duplicate_revisions = false

# Set to 'true' to run the environment during
# the revision command, even if no revisions will be generated.
# If SQLAlchemy detects that no changes have been made to the
# metadata, it will generate a migration that consists of just
# executing "COMMIT".  This allows revision files to be applied
# to a database that does not require any changes, and still
# retain the revision history.
treat_as_changed = false

# When set to 'true', the timestamp and revision number
# are included in the filename when generating a new
# migration file.
# The format of the timestamp is YYYY-MM-DD HH:MM:SS.
# The revision is always padded out to 12 characters.
# If set to 'false', only the revision number is used
# in the filename.
includefile = false

# When set to 'true', the ALMP file will be parsed
# for the purposes of determining the current
# revision for the environment.
# If not specified, the default behavior is to not
# parse the ALMP file.
parse_almp = false

# Specify the locale for sqrt() when calculating
# the approximate byte size of file contents
locale_source = default

# Maximum length of "billah" key to use in the
# NanumBarunGothicOTF Light font.
# max_filename_length = 64

# sqlalchemy.url will be set from application settings in env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(asctime)s %(message)s
datefmt = %H:%M:%S